<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaperDesk · 논문 편집</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#252c28;font:15px/1.6 "Apple SD Gothic Neo",system-ui,sans-serif}main{max-width:860px;margin:auto;padding:26px clamp(14px,4vw,42px) 50px}header{border-bottom:2px solid #293d33;padding-bottom:10px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:baseline}h1{font:36px Georgia,serif;letter-spacing:-2px;margin:0}small,label{font-size:13px;color:#41584d}section,details{background:#fffef9;border:1px solid #dadcd1;border-radius:10px;padding:16px;margin:12px 0}h2{font:600 18px system-ui;margin:0 0 12px}select,button,textarea{font:inherit;color:inherit}textarea{display:block;width:100%;min-height:145px;padding:12px;border:1px solid #b7c4bb;border-radius:5px;background:#fffefc;resize:vertical;line-height:1.65}button,select{padding:7px 10px;border:1px solid #b8c4b9;border-radius:5px;background:white;margin:3px 2px 3px 0}button{cursor:pointer}button.primary{background:#205740;color:white;border-color:#205740}button:disabled{opacity:.5;cursor:default}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}a{color:#205740}p{margin:7px 0}#status{color:#803b17}summary{cursor:pointer;font-weight:600}output{display:block;white-space:pre-wrap}label{display:block}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b76425}#review{border-top:3px solid #205740}[hidden]{display:none!important}
</style><main><header><h1>PaperDesk</h1><small>논문 편집</small></header>
<p id="loadingNotice" role="status">편집기를 불러오는 중입니다. 이 안내가 계속 보이면 <a href="https://pyeonshx.github.io/PaperDesk/public/standalone.html" target="_blank" rel="noopener">독립 실행 편집기 열기</a>를 선택하세요.</p><div class="row"><label>원고 섹션 <select id="sec"><option>Abstract</option><option>Introduction</option><option>Results</option><option>Discussion</option><option>Methods</option><option>Figure legend</option></select></label><label>투고 저널 <select id="journal"><option>미정</option><option>Nature</option><option>PLOS Biology</option></select></label></div>
<section><h2>원문</h2><button id="read" hidden>Word 선택 영역 가져오기</button> <button id="sample">예시 문단 넣기</button><small id="keyHelp">Enter로 점검 · Shift+Enter로 줄바꿈</small><textarea aria-describedby="keyHelp" id="src" aria-label="원문" placeholder="영문 문단 또는 한국어 메모를 입력하세요."></textarea><div class="row"><button class="primary" id="edit">표현·흐름 점검</button><button id="ai">AI 영문 초안 생성</button></div><small>기본 점검은 기기 안에서 실행됩니다. AI 버튼은 설정된 API로 원문과 선택한 작성 기준을 보냅니다.</small></section>
<section id="review" hidden><h2>수정안 비교</h2><label>수정안 · 직접 편집 가능<textarea id="draft"></textarea></label><output id="why"></output><output id="risk"></output><div class="row"><button id="copy">수정안 복사</button><button class="primary" hidden id="apply">Word 선택 영역에 적용</button></div></section>
<output role="status" id="status"></output><details open><summary>이 문단의 작성 기준과 출처</summary><div id="refs"></div></details>
<details open><summary>논문 전체 색인 검색</summary><p id="baselineCount"></p><p id="fulltextCount"></p><label for="paperQuery">주제, 저널 또는 DOI</label><input id="paperQuery" style="width:100%;padding:9px" placeholder="예: chromatin accessibility"><button id="paperSearch">전체 색인 검색</button> <a id="externalSearch" target="_blank" rel="noopener" href="https://europepmc.org/search?query=SRC%3AMED">Europe PMC에서 열기</a><p role="status" id="paperMessage"></p><div id="papers"></div><button id="morePapers" hidden>다음 20편</button></details>
<script src="stats/fulltext.js"></script><script src="stats/summary.js"></script><script src="corpus.js"></script><script src="app.js"></script><script src="literature.js"></script></main></html>
